
name: Tests

on:
  pull_request:
    branches: 
      - master
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} - NumPy ${{ matrix.numpy-version }} - ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
        numpy-version: ['1.26.1', '2.0']
        dependencies: ['minimal', 'latest']
        exclude:
          - python-version: '3.13'
            numpy-version: '1.26'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    # NumPy 1.26.1 with minimal dependencies
    - name: Install NumPy 1.26.1 minimal dependencies
      if: matrix.numpy-version == '1.26.1' && matrix.dependencies == 'minimal'
      run: |
        python -m pip install --upgrade pip
        pip install numpy==1.26.1 scipy==1.11.3 matplotlib==3.8.1 networkx==3.3
        pip install pytest==8.0.0 pytest-cov==5.0.0
    
    # NumPy 1.26.1 with latest dependencies
    - name: Install NumPy 1.26.1 latest dependencies
      if: matrix.numpy-version == '1.26.1' && matrix.dependencies == 'latest'
      run: |
        python -m pip install --upgrade pip
        pip install "numpy>=1.26.1,<2.0" "scipy>=1.11.3,<1.14" "matplotlib>=3.8.1,<3.10" networkx
        pip install pytest pytest-cov
    
    # NumPy 2.x with minimal dependencies
    - name: Install NumPy 2.x minimal dependencies
      if: matrix.numpy-version == '2.0' && matrix.dependencies == 'minimal'
      run: |
        python -m pip install --upgrade pip
        pip install numpy==2.0.0 scipy==1.13.0 matplotlib==3.9.0 networkx==3.3
        pip install pytest==8.0.0 pytest-cov==5.0.0
    
    # NumPy 2.x with latest dependencies
    - name: Install NumPy 2.x latest dependencies
      if: matrix.numpy-version == '2.0' && matrix.dependencies == 'latest'
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib networkx
        pip install pytest pytest-cov
    
    - name: Install sun4py package
      run: |
        pip install -e .
    
    - name: Display installed versions
      run: |
        python --version
        pip list
    
    - name: Run tests with coverage
      run: |
        pytest --cov=sun4py --cov-report=xml --cov-report=term-missing
    
    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        flag-name: py${{ matrix.python-version }}-np${{ matrix.numpy-version }}-${{ matrix.dependencies }}
        parallel: true

  coveralls-finish:
    name: Coveralls final report
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true

  type-check:
    name: Type checking with mypy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy>=1.11
        pip install -e .
    
    - name: Run mypy
      run: |
        mypy src/
      continue-on-error: false
